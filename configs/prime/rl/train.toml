# Prime-scale GRPO config targeting vf-function-caller.
# Tailor batch sizes and launcher fields to your cluster before running.

[run]
experiment_name = "vf-function-caller-prime"
project_name = "vf-function-caller"
output_dir = "artifacts/vf-function-caller-prime"

[policy]
model_id = "Qwen/Qwen2.5-3B-Instruct"
max_seq_len = 4096

[reference]
model_id = "Qwen/Qwen2.5-3B-Instruct"

[environment]
module = "vf-function-caller"
max_turns = 6

[trainer]
algorithm = "grpo"
total_epochs = 2
rollout_batch_size = 256
update_batch_size = 256
kl_target = 0.05
kl_coefficient = 0.0005
checkpoint_interval_steps = 50
evaluation_interval_steps = 50

[logging]
wandb_enabled = true
wandb_project = "vf-function-caller"
wandb_run_name = "prime-run"

[launcher]
num_nodes = 1
gpus_per_node = 4
launcher_type = "torchrun"
nnodes = 1
nproc_per_node = 4

[rollout]
inference_engine = "vllm"
gpu_memory_utilization = 0.9
max_concurrency = 256
timeout_seconds = 120
