[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vf-function-caller"
version = "0.1.0"
description = "Verifiers ToolEnv for teaching LLMs to make safe curl-style requests."
authors = [{ name = "Living Monstrosity Maintainers" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.0",
    "httpx>=0.27.0",
    "datasets>=2.19.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.entry-points."verifiers.environments"]
vf-function-caller = "vf_function_caller:load_environment"
